[project]
name = "nautilus-angel"
version = "0.1.0"
description = "NSE/NFO backtesting, paper and live trading on Nautilus Trader with Angel One SmartAPI"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "nautilus_trader==1.231.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nautilus_angel"]
